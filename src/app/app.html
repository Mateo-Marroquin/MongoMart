<header class="navbar sticky top-0 z-20 border-b border-base-300 bg-base-100/95 px-4 shadow-sm backdrop-blur md:px-8">
  <div class="mx-auto flex w-full max-w-7xl items-center">
    <a class="btn btn-ghost text-xl font-bold" routerLink="/">{{ title }}</a>
    <nav class="ml-auto">
      <ul class="menu menu-horizontal items-center gap-1 px-1">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a></li>
        <li><a routerLink="/products" routerLinkActive="active">Productos</a></li>
        <li>
          <a routerLink="/cart" routerLinkActive="active" aria-label="Carrito">
            Carrito
            <span class="badge badge-primary badge-sm">{{ cartItemCount() }}</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<router-outlet />
