<main>
  <app-offers-carousel/> <!--class="block px-4 pt-6 md:px-8"-->

  <section class="mx-auto max-w-7xl px-4 py-10 md:px-8">
    <div class="mb-6">
      <h2 class="text-3xl font-bold">Tecnología</h2>
      <p class="mt-1 text-base-content/70">Descubre lo nuevo en tecnología.</p>
    </div>
    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
      @for (product of techProducts; track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
    <div
      class="hero mt-8 min-h-72 overflow-hidden rounded-box bg-cover bg-center"
      style="background-image: url('https://images.pexels.com/photos/32912404/pexels-photo-32912404.jpeg?auto=compress&cs=tinysrgb&w=1600')"
    >
      <div class="hero-overlay bg-black/55"></div>
      <div class="hero-content py-12 text-center text-neutral-content">
        <h2 class="text-3xl font-bold md:text-5xl">Lo último en tecnología</h2>
      </div>
    </div>
  </section>

  <section class="mx-auto max-w-7xl px-4 pb-4 md:px-8">
    <div class="mb-6">
      <h2 class="text-3xl font-bold">Frutas y verduras</h2>
    </div>
    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
      @for (product of groceryProducts; track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  </section>

  <app-store-footer />
</main>
