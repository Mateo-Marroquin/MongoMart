<main class="mx-auto min-h-[70vh] max-w-7xl px-4 py-10 md:px-8">
  <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-3xl font-bold">Catálogo de productos</h1>
      <p class="mt-1 text-base-content/70">Productos disponibles en MongoMart.</p>
    </div>
    <a class="btn btn-primary" routerLink="/products/new">Crear producto</a>
  </div>

  @if (isLoading()) {
    <p role="status" class="py-8 text-center text-base-content/70">Cargando productos...</p>
  } @else if (error()) {
    <div class="alert alert-error">
      <span>{{ error() }}</span>
      <button class="btn btn-sm" type="button" (click)="loadProducts()">Reintentar</button>
    </div>
  } @else {
    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
      @for (product of products(); track product._id) {
        <app-product-card [product]="product" />
      } @empty {
        <div class="alert alert-info col-span-full">
          <span>No hay productos disponibles.</span>
        </div>
      }
    </div>
  }
</main>

<app-store-footer />
